version: "2"

run:
  timeout: 5m
  go: "1.26.1"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gocritic
    - revive
    - misspell
    - errorlint
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
