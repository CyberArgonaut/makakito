version: "1"
name: Redis blackout
description: Stop Redis and verify graceful degradation.
labels:
  phase: "1"
  env: staging

hypothesis:
  title: API returns 200 during Redis outage
  probes:
    - type: http
      url: http://localhost:8080/healthz
      expected_status: 200
      timeout: 5s

method:
  - type: fault
    name: Stop Redis container
    target:
      kind: docker
      selector:
        name: redis
    fault:
      kind: container-stop
    duration: 60s
    rollback: auto

controls:
  blast_radius:
    max_targets: 1
  timeout: 3m
  environments:
    - staging
